# Web UI → Next.js on PM2 (:3000)
# Install: sudo cp this file to /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/papertrade.parthkadam.tech.conf /etc/nginx/sites-enabled/
# Then:    sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d papertrade.parthkadam.tech

server {
    listen 80;
    listen [::]:80;
    server_name papertrade.parthkadam.tech;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
