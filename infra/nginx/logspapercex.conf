# Grafana (+ Loki Explore) — keep Loki itself on 127.0.0.1:3100 only.
# DNS: A record logspapercex.parthkadam.tech → this VPS
# Then: sudo ln -sf .../logspapercex.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d logspapercex.parthkadam.tech
# Also set GRAFANA_ROOT_URL=https://logspapercex.parthkadam.tech and recreate grafana.

server {
    server_name logspapercex.parthkadam.tech;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/logspapercex.parthkadam.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logspapercex.parthkadam.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = logspapercex.parthkadam.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name logspapercex.parthkadam.tech;
    return 404; # managed by Certbot


}