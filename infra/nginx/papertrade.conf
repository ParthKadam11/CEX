# paperdesk.fun → Next.js (PM2 cex-web on :3000)
server {
    server_name paperdesk.fun www.paperdesk.fun;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paperdesk.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paperdesk.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = paperdesk.fun) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.paperdesk.fun) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name paperdesk.fun www.paperdesk.fun;
    return 404; # managed by Certbot

}