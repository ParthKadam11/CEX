# logs.paperdesk.fun — not publicly proxied.
# Grafana stays on 127.0.0.1:3001. Reach it with an SSH tunnel:
#   ssh -L 3001:127.0.0.1:3001 deployer@<vps>
# then open http://127.0.0.1:3001

server {
    listen 80;
    listen [::]:80;
    server_name logs.paperdesk.fun;
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name logs.paperdesk.fun;

    ssl_certificate /etc/letsencrypt/live/paperdesk.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperdesk.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 404;
    }
}
