global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # PM2 gateway on the host (Compose uses network_mode: host for this scrape).
  - job_name: engine-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4020"]
        labels:
          service: engine-gateway
